<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>xClick</title>
<link rel="stylesheet" href="ui-theme.css">
<style>
:root{color-scheme:light;font:16px/1.5 var(--ui-font);color:#202332;background:var(--ui-page);--line:var(--ui-line);--ink:#393f57}
*{box-sizing:border-box}
/* Chrome sizes the toolbar popup from its content before it has a final viewport. */
html{width:320px;scrollbar-width:none}
body{margin:0;padding:16px}
header,.ctl,.sceneHead,.actions,summary{display:flex;align-items:center;gap:10px}
header{padding:1px 0 17px}
header img{width:32px;height:32px}
h1{font-size:23px;line-height:1;margin:0;font-weight:730;letter-spacing:-.8px;white-space:nowrap}
button,select,input{font:inherit}
button,summary,select{cursor:pointer}
:focus-visible{outline:2px solid var(--ui-action);outline-offset:3px}
select,.test{color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:15px;line-height:1.35}
select{max-width:100%;min-width:0}
#uiLanguage{margin-inline-start:auto}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ctl{min-height:46px;padding:8px 13px;justify-content:space-between}
.ctl+.ctl{border-top:1px solid var(--line)}
.ctl>label:first-child{font-weight:550}
.ctl:has(#themePreset){flex-wrap:wrap}
#themePreset{flex-shrink:0;margin-inline-start:auto}
.master{color:var(--ui-action);background:linear-gradient(110deg,var(--ui-tint) 55%,color-mix(in srgb,var(--xp-accent) 12%,white))}
.switch{position:relative;display:inline-block;width:34px;height:20px;flex:none}
.switch input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.track{position:absolute;inset:0;border-radius:12px;background:#adb2c2;pointer-events:none}
.track::after{content:'';position:absolute;width:14px;height:14px;top:3px;left:3px;border-radius:50%;background:white;box-shadow:0 1px 2px #21233933;transition:transform .16s}
.switch input:checked+.track{background:var(--ui-action)}
.switch input:checked+.track::after{transform:translateX(14px)}
.switch input:focus-visible+.track{outline:2px solid var(--ui-action);outline-offset:3px}
input:disabled,select:disabled,input:disabled+.track{opacity:.5}
input[type=range]{accent-color:var(--ui-action);min-width:40px;width:38%;margin-inline-start:auto}
.volPct{font-size:15px;font-variant-numeric:tabular-nums;color:#555e73;min-width:32px;text-align:end}
details,.actions{border-bottom:1px solid var(--line)}
summary{list-style:none;justify-content:space-between;padding:13px 2px;font-weight:600;font-size:16px}
summary::-webkit-details-marker{display:none}
summary::after{content:'';width:7px;height:7px;flex:none;margin-right:6px;border:solid #7b8398;border-width:0 1.6px 1.6px 0;transform:rotate(45deg)}
details[open]>summary::after{transform:rotate(225deg)}
.detailsBody{padding-bottom:12px}
.detailsBody .ctl{padding-inline:2px}
.actions{padding:13px 2px 0;border:0;justify-content:space-between;font-size:16px;font-weight:600}
button{color:var(--ui-action)}
#aiSettings{font-weight:600;border:0;padding:5px 0;background:none;font-size:15px}
#aiSettings::after{content:' ↗'}
button:hover{filter:brightness(.93)}
.sceneList{margin-top:9px}
.sceneCtl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line)}
.sceneCtl:last-child{border-bottom:0}
.sceneHead{flex:1 0 auto;justify-content:space-between;font-size:15px}
.sceneHead strong{font-weight:550}
.sceneMode{flex:0 1 auto;margin-inline-start:auto}
.testRow{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.test{padding:7px 6px}
.previewStage{position:relative;display:grid;place-items:center;height:90px;margin-top:2px;overflow:hidden;border-radius:10px;background:radial-gradient(ellipse at 50% 40%,color-mix(in srgb,var(--xp-primary) 15%,#1d263b),#141a29 75%);--preview-primary:var(--xp-primary);--preview-accent:var(--xp-accent)}
.previewTarget{color:white;font-size:22px;font-weight:700;line-height:1}
.previewCaption{position:absolute;bottom:7px;color:var(--preview-primary);font-size:13px}
@media(prefers-reduced-motion:reduce){.track::after{transition:none}}
.previewRing{position:absolute;left:50%;top:50%;width:28px;height:28px;border:2px solid var(--preview-primary);border-radius:50%;transform:translate(-50%,-50%) scale(.3);animation:preview-ring .7s ease-out forwards;box-shadow:0 0 12px var(--preview-primary)}
.previewRing.alt{border-color:var(--preview-accent);animation-delay:.08s}
.previewTarget.playing{animation:preview-pop .5s cubic-bezier(.2,.8,.2,1)}
.previewParticle{position:absolute;left:50%;top:50%;width:5px;height:5px;border-radius:50%;background:var(--preview-primary);box-shadow:0 0 8px var(--preview-primary);animation:preview-particle .65s ease-out forwards}
.previewParticle.alt{background:var(--preview-accent);box-shadow:0 0 8px var(--preview-accent)}
.previewStage[data-scene="like"] .previewParticle{width:auto;height:auto;background:none;box-shadow:none;color:var(--preview-accent);font-size:10px;line-height:1}
.previewStage[data-scene="follow"] .previewRing{border-style:dashed}
.previewScan{position:absolute;left:15%;top:50%;height:2px;width:70%;background:linear-gradient(90deg,transparent,var(--preview-primary),var(--preview-accent),transparent);box-shadow:0 0 10px var(--preview-primary);animation:preview-scan .65s ease-out forwards}
@keyframes preview-scan{from{opacity:1;transform:scaleX(.2) translateY(-12px)}to{opacity:0;transform:scaleX(1) translateY(12px)}}
@keyframes preview-ring{to{opacity:0;transform:translate(-50%,-50%) scale(3.6)}}
@keyframes preview-pop{50%{transform:scale(1.25);box-shadow:0 0 25px var(--preview-primary)}to{transform:scale(1)}}
@keyframes preview-particle{to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}
@media(prefers-reduced-motion:reduce){.previewRing,.previewTarget,.previewParticle,.previewScan{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<header>
  <img src="assets/icons/icon-48.png" alt=""><h1>xClick</h1>
  <select id="uiLanguage" data-i18n-aria="language" aria-label="Interface language">
    <option value="en" lang="en">English</option>
    <option value="zh-Hans" lang="zh-Hans">简体中文</option>
    <option value="zh-Hant" lang="zh-Hant">繁體中文</option>
    <option value="de" lang="de">Deutsch</option>
    <option value="it" lang="it">Italiano</option>
    <option value="ja" lang="ja">日本語</option>
    <option value="ko" lang="ko">한국어</option>
    <option value="fr" lang="fr">Français</option>
  </select>
</header>
<main>
<section class="panel" data-i18n-aria="extension" aria-label="Extension">
  <div class="ctl master">
    <label for="fxOn" data-i18n="effects">Enable effects</label>
    <label class="switch" for="fxOn">
      <input type="checkbox" id="fxOn">
      <span class="track" aria-hidden="true"></span>
    </label>
  </div>
  <div class="ctl">
    <label for="sndOn" data-i18n="soundOn">Enable sounds</label>
    <label class="switch" for="sndOn">
      <input type="checkbox" id="sndOn">
      <span class="track" aria-hidden="true"></span>
    </label>
  </div>
  <div class="ctl">
    <label for="themePreset" data-i18n="theme">Color theme</label>
    <select id="themePreset" data-i18n-aria="theme" aria-label="Color theme">
      <option value="cyber" data-i18n="cyber">Cyber neon</option>
      <option value="aurora" data-i18n="aurora">Aurora</option>
      <option value="sakura" data-i18n="sakura">Sakura</option>
      <option value="mono" data-i18n="mono">Monochrome</option>
      <option value="custom" data-i18n="custom">Custom palette</option>
      <option value="shuffle" data-i18n="surprise">Surprise me</option>
    </select>
  </div>
</section>
<details>
  <summary data-i18n="studio">Animation studio</summary>
  <div class="detailsBody">
  <div class="previewStage" id="previewStage" aria-live="polite"><div class="previewTarget">X</div><div class="previewCaption" data-i18n="pick">PICK A SCENE</div></div>
  <div class="testRow" data-i18n-aria="preview" aria-label="Preview animation and sound">
    <button class="test" data-kind="like" type="button" data-i18n="previewLike">♥ Preview like</button>
    <button class="test" data-kind="follow" type="button" data-i18n="previewFollow">＋ Preview follow</button>
    <button class="test" data-kind="reply" type="button" data-i18n="previewReply">↳ Preview reply</button>
    <button class="test" data-kind="comment" type="button" data-i18n="previewComment">✦ Preview comment</button>
  </div>
<div class="sceneList" data-i18n-aria="scenes" aria-label="Animation settings by scene">
    <div class="sceneCtl">
      <div class="sceneHead"><div><strong data-i18n="like">Like animation</strong></div><label class="switch"><input type="checkbox" class="sceneAnimation" data-kind="like" data-i18n-aria="likeOn" aria-label="Enable like animation"><span class="track" aria-hidden="true"></span></label></div>
      <select class="sceneMode" data-kind="like" data-i18n-aria="likeStyle" aria-label="Like animation style"><option value="classic" data-i18n="pulse">Pulse</option><option value="alt" data-i18n="neon">Neon burst</option><option value="rotate" data-i18n="rotateStyles">Rotate styles</option></select>
    </div>
    <div class="sceneCtl">
      <div class="sceneHead"><div><strong data-i18n="follow">Follow animation</strong></div><label class="switch"><input type="checkbox" class="sceneAnimation" data-kind="follow" data-i18n-aria="followOn" aria-label="Enable follow animation"><span class="track" aria-hidden="true"></span></label></div>
      <select class="sceneMode" data-kind="follow" data-i18n-aria="followStyle" aria-label="Follow animation style"><option value="classic" data-i18n="pulse">Pulse</option><option value="alt" data-i18n="neon">Neon burst</option><option value="rotate" data-i18n="rotateStyles">Rotate styles</option></select>
    </div>
    <div class="sceneCtl">
      <div class="sceneHead"><div><strong data-i18n="reply">Reply animation</strong></div><label class="switch"><input type="checkbox" class="sceneAnimation" data-kind="reply" data-i18n-aria="replyOn" aria-label="Enable reply animation"><span class="track" aria-hidden="true"></span></label></div>
      <select class="sceneMode" data-kind="reply" data-i18n-aria="replyStyle" aria-label="Reply animation style"><option value="classic" data-i18n="pulse">Pulse</option><option value="alt" data-i18n="neon">Neon burst</option><option value="rotate" data-i18n="rotateStyles">Rotate styles</option></select>
    </div>
    <div class="sceneCtl">
      <div class="sceneHead"><div><strong data-i18n="comment">Comment animation</strong></div><label class="switch"><input type="checkbox" class="sceneAnimation" data-kind="comment" data-i18n-aria="commentOn" aria-label="Enable comment animation"><span class="track" aria-hidden="true"></span></label></div>
      <select class="sceneMode" data-kind="comment" data-i18n-aria="commentStyle" aria-label="Comment animation style"><option value="classic" data-i18n="pulse">Pulse</option><option value="alt" data-i18n="neon">Neon burst</option><option value="rotate" data-i18n="rotateStyles">Rotate styles</option></select>
    </div>
  </div>
  </div>
</details>
<details>
  <summary data-i18n="audioSettings">Audio settings</summary>
  <div class="detailsBody">
  <div class="ctl">
    <label for="sndVol" data-i18n="volume">Volume</label>
    <input type="range" id="sndVol" min="0" max="100" step="1">
    <span class="volPct" id="sndVolPct">15%</span>
  </div>
  <div class="ctl">
    <label for="soundMode" data-i18n="soundMode">Sound mode</label>
    <select id="soundMode">
      <option value="classic" data-i18n="classic">Classic</option>
      <option value="alt" data-i18n="alt">Alt</option>
      <option value="rotate" data-i18n="rotate">Rotate</option>
    </select>
  </div>
  </div>
</details>
<div class="actions"><span data-i18n="aiReplies">AI replies</span><button type="button" id="aiSettings" data-i18n="configure">Configure provider</button></div>
</main>
<script src="sound.js"></script>
<script type="module" src="popup.js"></script>
</body>
</html>
